<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#efefed">
<title>おうちめぐり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Shippori+Mincho+B1:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --white:#ffffff; --g0:#f7f7f6; --g1:#efefed; --g2:#e3e3e0; --g3:#cdccc8;
  --ink:#232221; --ink2:#4a4845; --sub:#6e6b66; --mute:#9b978f;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --oak:#b08559; --oak-d:#8c6845; 
  --serif:'Shippori Mincho B1',serif; --sans:'Zen Kaku Gothic New',system-ui,sans-serif; --latin:'Cormorant Garamond',serif;
  --grain:repeating-linear-gradient(91deg,#bd9168 0 2px,#b08559 2px 6px,#c29a71 6px 8px,#a77b51 8px 13px,#b78b60 13px 17px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--white);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"palt"}
a{color:inherit}
button{font-family:inherit}
.woodbar{height:3px;background:var(--grain)}
.eyebrow{margin:0;font-family:var(--latin);font-style:italic;font-size:15px;letter-spacing:.12em;color:var(--oak-d)}
.cap{font-size:10px;letter-spacing:.28em;color:var(--sub);font-weight:500;text-transform:uppercase}
.hint{color:var(--sub);font-size:12px;line-height:1.8;font-weight:400}
.jp{word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
h1,h2,.stitle,.q{text-wrap:balance}
p,.tt,.txt{text-wrap:pretty}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;color:var(--ink2);font-weight:500}
.tag::before{content:"";width:16px;height:1px;background:var(--c)}
.spin{width:22px;height:22px;border:1.5px solid var(--g2);border-top-color:var(--ink);border-radius:50%;margin:140px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:12.5px;letter-spacing:.1em;padding:12px 22px;border-radius:0;text-decoration:none;cursor:pointer;font-weight:500;transition:background .15s,opacity .15s;white-space:nowrap}
.btn:hover{background:#3a3835}
.btn.light{background:var(--white);color:var(--ink);border-color:var(--white)}
.btn.light:hover{background:var(--g0)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:rgba(0,0,0,.03)}
.btn.block{width:100%}
.btn.sm{padding:9px 14px;font-size:12px}
.btn:disabled{opacity:.3;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:12.5px}
.link.danger{color:#9b4b36}
label.f{display:block;font-size:11px;font-weight:500;letter-spacing:.18em;margin-bottom:20px;color:var(--sub)}
label.f .hint{display:block;margin-top:2px;letter-spacing:.02em}
input[type=text],input[type=tel],textarea{display:block;width:100%;margin-top:8px;font:inherit;font-size:15px;font-weight:400;color:var(--ink);background:var(--g1);border:1px solid transparent;border-radius:0;padding:12px 14px;line-height:1.7;letter-spacing:0;transition:border-color .15s,background .15s}
input:focus,textarea:focus{outline:none;background:var(--white);border-color:var(--ink)}
.on-gray input[type=text],.on-gray input[type=tel],.on-gray textarea{background:var(--white)}
textarea{resize:vertical}
.pin{letter-spacing:.6em;text-align:center;font-family:var(--latin);font-size:24px!important;padding-left:calc(14px + .6em)!important}
.check{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:18px;cursor:pointer}
.check input{accent-color:var(--ink);width:16px;height:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.row input{margin-top:0;flex:1;min-width:0}
.err{color:#9b4b36;font-size:12.5px;margin:-6px 0 16px}

/* ---------- landing ---------- */
.landing{min-height:100vh;background:var(--g1);display:flex;flex-direction:column}
.landing main{flex:1;max-width:440px;width:100%;margin:0 auto;padding:72px 24px 48px}
.logo{font-family:var(--serif);font-weight:600;font-size:42px;letter-spacing:.1em;margin:14px 0 8px}
.tagline{color:var(--ink2);font-size:13.5px;letter-spacing:.12em;margin:0 0 48px}
.box{background:var(--white);padding:28px 24px;margin-bottom:10px}
.box h2{font-family:var(--serif);font-weight:500;font-size:17px;margin:0 0 6px;letter-spacing:.04em}
.box p{margin:0 0 18px}
.modebadge{font-size:11px;color:var(--sub);text-align:center;margin-top:26px;line-height:1.9}
.back{font-size:12px;color:var(--ink2);text-decoration:none;letter-spacing:.06em}

/* ---------- guest home ---------- */
.hero{background:var(--g1);padding:30px 24px 0}
.hero-in{max-width:560px;margin:0 auto;position:relative;z-index:1}
.hero-top{min-height:40px}
.me{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);background:var(--white);padding:7px 12px 7px 10px;border:0;cursor:pointer;letter-spacing:.04em}
.me i{width:20px;height:20px;border-radius:50%;background:var(--av,var(--ink));color:#fff;font-style:normal;font-size:10px;display:flex;align-items:center;justify-content:center}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,8vw,36px);line-height:1.4;margin:0;letter-spacing:.05em}
.hero{position:relative;overflow:hidden}
.hero-title{margin:22px 0 20px;padding-right:84px}
.hero-title .eyebrow{margin-bottom:10px}
.lamp{position:absolute;top:-30px;right:8px;width:64px;pointer-events:none}
.lamp svg{display:block;width:64px;height:124px;overflow:visible}
.lamp svg *{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:butt}
.lamp svg .oak{stroke:var(--oak);stroke-width:2.4}
.intro .lamp svg *{stroke-dasharray:1 1.01;stroke-dashoffset:1.005;opacity:0;animation:draw var(--d,.6s) cubic-bezier(.6,0,.3,1) var(--w,0s) forwards,show .01s linear var(--w,0s) forwards}
@keyframes show{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.intro .lamp svg .oak{stroke-dasharray:1 1.01;stroke-dashoffset:1.005}
.intro .rise{opacity:0;animation:rise .9s ease var(--w,1.7s) forwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.intro .lamp svg *{animation:none;stroke-dashoffset:0;opacity:1}.intro .rise{animation:none;opacity:1}}
.hero .lead{line-height:2.05;font-size:14px;color:var(--ink2);margin:0 0 14px;white-space:pre-wrap}
.hero .host{font-size:11px;color:var(--sub);margin:0;letter-spacing:.14em}
.progress{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:30px;padding:16px 0 22px;border-top:1px solid var(--g3)}
.pnum{font-family:var(--mono);display:flex;align-items:baseline;gap:4px;line-height:1;font-size:12px;color:var(--sub);letter-spacing:.04em}
.pnum b{font-size:12px;font-weight:500;color:var(--ink)}
.pnum span{color:var(--sub)}
.bar{height:1px;background:var(--g3);position:relative}
.bar i{position:absolute;left:0;top:-1px;height:3px;background:var(--grain);transition:width .6s ease}
.wrap{max-width:560px;margin:0 auto;padding:28px 24px 0}
.sample{font-size:11px;color:var(--sub);background:var(--g0);padding:9px 12px;margin-bottom:22px;text-align:center;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 14px}
.tile{display:block;text-decoration:none;color:inherit}
.tile .th{aspect-ratio:1/1;overflow:hidden;background:var(--g1);position:relative}
.tile .th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.tile:hover .th img{transform:scale(1.03)}
.tile .tb{padding:10px 2px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tile .no{font-family:var(--latin);font-size:16px;color:var(--oak-d);line-height:1}
.tile .tt{font-size:13px;font-weight:500;line-height:1.55;margin-top:5px}
.tile .cc{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);font-family:var(--latin);flex:none}
.tile .cc svg{width:13px;height:13px}
.tile:not(.hidden) .th{box-shadow:inset 0 0 0 1px var(--g2)}
.tile:not(.hidden) .ph{background:var(--g0)}
.tile.hidden .th{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--g1))}
.tile.hidden .th svg{width:26px;height:26px;opacity:.75}
.tile.hidden .th .cap{color:var(--c)}
.tile .badge{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--white);color:var(--oak-d);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tile .badge svg{width:13px;height:13px}
.tile.hidden .th .cap{font-size:9px;letter-spacing:.3em}
.tile.hidden .no{color:var(--g3)}
.tile.hidden .tt{color:var(--sub);font-weight:400;font-size:12px}
.foot-band{background:var(--g1);margin-top:52px;padding:30px 24px 120px;text-align:center}
.howto{color:var(--sub);font-size:12px;line-height:2;margin:0}
.complete{position:relative;background:var(--ink);color:#efece7;padding:26px 24px 28px;margin:0 0 30px;overflow:hidden}
.complete::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grain)}
.complete .eyebrow{color:#cfb08c}
.complete p{margin:10px 0 0;line-height:2;font-size:14px;white-space:pre-wrap}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink2);background:var(--g1)}
.ph svg{width:28%;max-width:80px;opacity:.4}

/* ---------- museum ---------- */
.en{font-family:var(--latin);font-style:italic;color:var(--sub);font-size:16px;margin:6px 0 0;letter-spacing:.02em}
.hero-title .cap{display:block;margin-bottom:12px}
.exinfo{display:grid;gap:5px;margin:20px 0 0}
.exinfo div{display:grid;grid-template-columns:48px 1fr;font-size:12.5px;color:var(--ink2);line-height:1.7}
.exinfo dt{color:var(--sub);font-size:10.5px;letter-spacing:.24em;padding-top:2px}
.exinfo dd{margin:0}
.greet{padding:2px 0 40px}
.glead{font-size:14px;line-height:2.15;color:var(--ink2);margin:12px 0 0}
.sign{text-align:right;font-family:var(--serif);font-size:13px;margin:14px 0 0;color:var(--ink2)}
.sign::before{content:"— "}
.room{margin-bottom:38px}
.rh{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:9px}
.rn{font-size:10.5px;letter-spacing:.24em;color:var(--oak-d);font-weight:500;font-family:var(--mono)}
.rt{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.06em}
.rc{font-family:var(--mono);font-size:12px;color:var(--sub)}
.items{list-style:none;margin:0;padding:0}
.items li{border-bottom:1px solid var(--g2)}
.items .row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:15px 2px;text-decoration:none;color:inherit}
.items .no{font-family:var(--mono);font-size:13px;color:var(--oak-d);line-height:1;letter-spacing:.04em}
.items .it{font-size:14px;font-weight:500;line-height:1.6}
.items .it small{display:block;font-family:var(--latin);font-style:italic;font-weight:400;color:var(--sub);font-size:13.5px;line-height:1.4}
.items .mk{display:flex;gap:12px;align-items:center;color:var(--oak-d)}
.items .mk>svg{width:16px;height:16px}
.items .cc{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);font-family:var(--latin)}
.items .cc svg{width:13px;height:13px}
.items a.row:hover .it{text-decoration:underline;text-underline-offset:4px}
.items .unseen .no{color:var(--mute)}
.items .unseen .it{color:var(--sub);font-weight:400;letter-spacing:.2em}
.items .unseen .it small{font-family:var(--sans);font-style:normal;font-size:10.5px;letter-spacing:.16em;color:var(--sub);margin-top:2px}
.roomline{font-size:10.5px;letter-spacing:.22em;color:var(--sub);margin:0;padding:0 24px 12px}
.credit{font-family:var(--latin);font-style:italic;font-size:12.5px;color:var(--sub);margin:8px 0 0;text-align:right}
.captbl{margin:24px 0 32px;border-top:1px solid var(--g3)}
.captbl div{display:grid;grid-template-columns:62px 1fr;padding:10px 0;font-size:13px;line-height:1.7;position:relative}
.captbl div::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--g2)}
.captbl dt{color:var(--sub);font-size:10.5px;letter-spacing:.24em;padding-top:2px}
.captbl dd{margin:0}
.lbl{display:block;margin:0 0 8px}
/* ---------- ticket ---------- */
.tk-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:var(--sub)}
.tk-no{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--oak-d)}
.stub{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:var(--white);border:1px solid var(--g3);padding:12px 16px;margin:0 0 30px;position:relative;font:inherit;color:var(--ink);text-align:left}
.stub::before,.stub::after{content:"";position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--white);border:1px solid var(--g3)}
.stub::before{left:-7px;border-left-color:transparent;border-bottom-color:transparent;transform:rotate(45deg)}
.stub::after{right:-7px;border-right-color:transparent;border-top-color:transparent;transform:rotate(45deg)}
.stub-l{display:flex;flex-direction:column;gap:3px}
.stub-l b{font-weight:500;font-size:14px;font-family:var(--serif);letter-spacing:.04em}
.stub-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.stub-r .link{font-size:11px}
.stub-empty{cursor:pointer;font-size:13px;letter-spacing:.06em}
.stub-empty:hover{background:var(--g0)}
.ticket-ov{align-items:center}
.tk-wrap{width:100%;max-width:360px;text-align:center;animation:tkin .6s cubic-bezier(.2,1,.3,1) both}
@keyframes tkin{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.tk-lead{color:#fff;font-size:13px;letter-spacing:.14em;margin:0 0 16px}
.ticket{display:flex;background:#fbf8f2;color:var(--ink);text-align:left;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.tk-main{flex:1;padding:20px 18px 18px;border-right:0}
.tk-top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:8px}
.tk-ex{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.5;margin:14px 0 0;letter-spacing:.04em}
.tk-en{font-family:var(--latin);font-style:italic;font-size:12.5px;color:var(--sub);margin:2px 0 0}
.tk-name{font-family:var(--serif);font-size:19px;line-height:1.5;margin:18px 0 0;letter-spacing:.06em}
.tk-perf{width:0;border-left:1.5px dashed var(--g3);margin:10px 0;position:relative}
.tk-stub{width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px 6px}
.tk-stub .tk-lbl{writing-mode:vertical-rl;letter-spacing:.4em;font-family:var(--sans);font-size:10.5px}
.tk-stub .tk-no{font-size:13px}
.tk-note{color:rgba(255,255,255,.85);font-size:12px;line-height:1.8;margin:16px 0 14px}
.tk-wrap .btn{background:#fff;color:var(--ink);border-color:#fff}
.sh-sub{font-size:12px;color:var(--sub);margin:6px 0 0;letter-spacing:.04em}
/* ---------- motion ---------- */
@keyframes mfade{from{opacity:0}to{opacity:1}}
@keyframes mrise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes mline{from{width:0}to{width:100%}}
.enter .photo{animation:phin 1s ease both}
@keyframes phin{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:none}}
.enter .captbl div::after{animation:mline .7s cubic-bezier(.6,0,.3,1) both;animation-delay:var(--d,0s)}
.enter .captbl dt,.enter .captbl dd{animation:mfade .5s ease both;animation-delay:calc(var(--d,0s) + .2s)}
.vis.anim{border-color:transparent}
.vis.anim::before,.vis.anim::after{content:"";position:absolute;inset:-1px;pointer-events:none}
.vis.anim::before{border-top:1px solid var(--oak);border-bottom:1px solid var(--oak);animation:vtb .6s cubic-bezier(.6,0,.3,1) .35s both}
.vis.anim::after{border-left:1px solid var(--oak);border-right:1px solid var(--oak);animation:vlr .6s cubic-bezier(.6,0,.3,1) .35s both}
@keyframes vtb{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes vlr{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.vis.anim>*{animation:mfade .5s ease .9s both}
.vis.anim{color:transparent;animation:vtxt .01s linear .9s forwards}
@keyframes vtxt{to{color:var(--oak-d)}}
.items li.hl .row{animation:hl 1.8s ease .25s both}
@keyframes hl{0%{background:rgba(214,186,148,.42)}100%{background:rgba(214,186,148,0)}}
.bar i.grow{animation:bgrow 1s cubic-bezier(.4,0,.2,1) .35s both}
@keyframes bgrow{from{width:var(--from)}}
.celebrate .items .no{animation:noak .45s ease both;animation-delay:calc(var(--i,0)*.13s + .3s)}
@keyframes noak{from{color:var(--g3)}to{color:var(--oak-d)}}
.celebrate-done{animation:mrise .8s ease both;animation-delay:var(--w,1s)}
.citem.ni{animation:cins .8s cubic-bezier(.4,0,.2,1) both}
@keyframes cins{0%{max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin-bottom:-6px}60%{opacity:0}100%{max-height:240px;opacity:1}}
.tk-perf{animation:perf .8s ease .55s both}
@keyframes perf{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.welcome-toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:40;background:var(--white);color:var(--ink);border:1px solid var(--g3);padding:10px 20px;font-size:12.5px;letter-spacing:.14em;pointer-events:none;animation:wtoast 2.6s ease both;box-shadow:0 8px 24px rgba(35,34,33,.1)}
@keyframes wtoast{0%{opacity:0;transform:translate(-50%,-6px)}18%,78%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-4px)}}
#app.pg-in{animation:pgin .28s ease both}
@keyframes pgin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.enter .photo,.enter .captbl div::after,.enter .captbl dt,.enter .captbl dd,.vis.anim,.vis.anim::before,.vis.anim::after,.vis.anim>*,.items li.hl .row,.bar i.grow,.celebrate .items .no,.celebrate-done,.citem.ni,.tk-perf,#app.pg-in,.welcome-toast{animation:none!important}.vis.anim{color:var(--oak-d);border-color:var(--oak)}}
/* ---------- spot ---------- */
.spotpage{max-width:560px;margin:0 auto}
.spotpage .top{display:flex;justify-content:space-between;align-items:center;padding:16px 22px}
.spotpage .count{font-family:var(--mono);font-size:12px;color:var(--sub)}
.photo-wrap{position:relative;background:var(--g1);padding:22px 24px 14px}
.photo{margin:0;aspect-ratio:4/3.2;overflow:hidden;background:var(--g0);border:10px solid var(--white);box-shadow:0 1px 0 var(--g2),0 10px 24px -14px rgba(35,34,33,.25)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.stamp{position:absolute;right:20px;bottom:-36px;width:84px;height:84px;border-radius:50%;background:var(--white);color:var(--oak-d);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 22px rgba(35,34,33,.12);transform:rotate(-8deg)}
.stamp::before{content:"";position:absolute;inset:5px;border:1px solid var(--oak);border-radius:50%}
.stamp b{font-family:var(--latin);font-style:italic;font-weight:500;font-size:18px;letter-spacing:.06em;line-height:1}
.stamp small{font-size:9px;letter-spacing:.24em;margin-top:5px;color:var(--ink2)}
.stamp.anim{animation:stamp .6s cubic-bezier(.2,1.5,.4,1) .3s both}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.2);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.sbody-wrap{padding:32px 24px 36px}

				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

function resizeImage(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const draw=m=>{const sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c};
      let max=1100,q=.8,c=draw(max),out=c.toDataURL('image/jpeg',q);
      while(out.length>170000&&max>400){if(q>.55)q-=.1;else{max-=150;c=draw(max);q=.75}out=c.toDataURL('image/jpeg',q)}
      URL.revokeObjectURL(url);res(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url;
  });
}
function errText(e){return e&&e.code==='quota'?'端末の保存容量がいっぱいです。写真を減らしてください。':/permission/i.test(String(e&&(e.code||e.message)))?'保存できませんでした（Firebaseのルールで書き込みが許可されていません）':'保存できませんでした。通信状況を確認してもう一度お試しください。'}

function qrSvg(text){
  try{const q=new QRLib.QRCode(-1,QRLib.L.M);q.addData(text);q.make();const n=q.getModuleCount();let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c} ${r}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n} ${n}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><path d="${d}" fill="#2a2622"/></svg>`}
  catch(e){return '<div class="qc-none">QRを作れませんでした</div>'}
}

/* ---------- QR scanner ---------- */
const SC={stream:null,raf:0,det:null,busy:false,last:0,warnAt:0,canvas:null};
function loadJsQR(){
  return new Promise(res=>{
    if(window.jsQR)return res(true);
    const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
    sc.onload=()=>res(!!window.jsQR);sc.onerror=()=>res(false);document.head.appendChild(sc);
  });
}
async function getDecoder(){
  if(SC.det)return SC.det;
  if('BarcodeDetector' in window){
    try{const fm=await BarcodeDetector.getSupportedFormats();if(fm.includes('qr_code')){const bd=new BarcodeDetector({formats:['qr_code']});SC.det=async src=>{const r=await bd.detect(src);return r[0]?.rawValue||null};return SC.det}}catch(e){}
  }
  if(await loadJsQR()){
    SC.det=async src=>{
      const w0=src.videoWidth||src.naturalWidth||src.width,h0=src.videoHeight||src.naturalHeight||src.height;if(!w0||!h0)return null;
      const k=Math.min(1,720/Math.max(w0,h0)),w=Math.round(w0*k),h=Math.round(h0*k);
      const c=SC.canvas||(SC.canvas=document.createElement('canvas'));c.width=w;c.height=h;
      const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,w,h);
      const r=window.jsQR(x.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'});return r?r.data:null;
    };
    return SC.det;
  }
  return null;
}
function scanMsg(t,warn){const el=$('#smsg');if(el){el.textContent=t;el.className='smsg'+(warn?' warn':'')}}
function handleQR(text){
  let u=null;try{u=new URL(text,location.href)}catch(e){}
  const p=u&&u.searchParams.get('p'),h=u?u.hash.slice(1):'';
  if(p&&p.toLowerCase()===S.code&&h.startsWith('s-')){closeScanner();if(location.hash.slice(1)===h)route();else location.hash=h;return true}
  if(Date.now()-SC.warnAt>2500){SC.warnAt=Date.now();scanMsg(p?'ほかのパーティのQRコードのようです':'おうちめぐりのカードではないようです',true);setTimeout(()=>scanMsg('カードのQRコードを枠に合わせてください'),2400)}
  return false;
}
async function openScanner(){
  const el=document.createElement('div');el.className='scanner';el.id='scanner';
  el.innerHTML=`<video playsinline muted autoplay></video><div class="shade"></div>
    <div class="frame"><i></i><i></i><i></i><i></i><i class="line"></i></div>
    <div class="stop"><p class="eyebrow">scan the card</p><button class="xbtn" data-act="scan-close" aria-label="閉じる">×</button></div>
    <div class="sbot"><p class="smsg" id="smsg">カメラを起動しています…</p>
      <label class="photo-btn">${ICON.camera}写真を撮って読み取る<input type="file" accept="image/*" capture="environment" id="scan-photo"></label></div>`;
  document.body.appendChild(el);document.body.style.overflow='hidden';
  const v=el.querySelector('video');
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){scanMsg('このブラウザではカメラを直接使えません。下のボタンからQRコードを撮影してください。',true);return}
  try{
    SC.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(!$('#scanner')){stopStream();return}
    v.srcObject=SC.stream;await v.play().catch(()=>{});
  }catch(e){scanMsg('カメラを使えませんでした。カメラを許可するか、下のボタンからQRコードを撮影してください。',true);return}
  const det=await getDecoder();
  if(!det){scanMsg('読み取りの準備ができませんでした。通信状況を確認するか、スマホのカメラアプリで読み取ってください。',true);return}
  scanMsg('カードのQRコードを枠に合わせてください');
  const tick=async t=>{
    if(!$('#scanner'))return;
    SC.raf=requestAnimationFrame(tick);
    if(SC.busy||t-SC.last<160||v.readyState<2)return;
    SC.busy=true;SC.last=t;
    try{const r=await det(v);if(r)handleQR(r)}catch(e){}
    SC.busy=false;
  };
  SC.raf=requestAnimationFrame(tick);
}
function stopStream(){if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null}}
function closeScanner(){cancelAnimationFrame(SC.raf);stopStream();const el=$('#scanner');if(el)el.remove();document.body.style.overflow='';SC.busy=false}
async function scanPhoto(file){
  scanMsg('読み取っています…');
  const det=await getDecoder();if(!det){scanMsg('読み取りの準備ができませんでした。通信状況を確認してください。',true);return}
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=async()=>{let r=null;try{r=await det(img)}catch(e){}URL.revokeObjectURL(url);
    if(r){SC.warnAt=0;handleQR(r)}else scanMsg('QRコードが見つかりませんでした。もう少し近づいて撮ってみてください。',true)};
  img.onerror=()=>{URL.revokeObjectURL(url);scanMsg('写真を読み込めませんでした。',true)};
  img.src=url;
}

document.addEventListener('submit',async e=>{
  e.preventDefault();const id=e.target.id;
  if(id==='openform'){const c=$('#opencode').value.trim().toLowerCase();if(c){location.hash='';openCode(c)}return}
  if(id==='createform'){
    const title=$('#c-title').value.trim(),host=$('#c-host').value.trim(),pin=$('#c-pin').value.trim(),sample=$('#c-sample').checked;
    if(!title){S.err='タイトルを入れてください';return renderCreate()}
    if(!/^\d{4,6}$/.test(pin)){S.err='暗証番号は4〜6桁の数字で入れてください';return renderCreate()}
    const btn=$('#c-go');btn.disabled=true;btn.textContent='作成中…';
    try{
      let code=genCode();for(let i=0;i<5&&await B.exists(code);i++)code=genCode();
      const spots={},order=[];
      if(sample)SAMPLE.forEach(s=>{const sid=newId('s');spots[sid]={...s,owner:s.origin&&host?host+'家':'',id:sid,photo:''};order.push(sid)});
      const h=await hashOf(`host|${code}|${pin}`);
      await B.create(code,{meta:{title,host,titleEn:'',period:'',venue:host?host+'家':'',welcome:'本日はご来場いただき、ありがとうございます。\n家のあちこちに展示カードを置いています。気の向くままに、QRを読み取ってご覧ください。',complete:'すべての展示をご覧いただきました。ありがとうございます。',closed:false,sample,order,pinHash:h,createdAt:Date.now()},spots});
      store.set('uchimeguri:host:'+code,h);
      location.hash='edit';openCode(code);
    }catch(err){console.warn(err);S.err='作成できませんでした。通信状況やFirebaseのルールを確認してください。';renderCreate()}
    return;
  }
  if(id==='loginform'){
    const pin=$('#l-pin').value.trim();
    let h=await hashOf(`host|${S.code}|${pin}`);
    if(h!==meta().pinHash){const old=await hashOf(`${S.code}|${pin}`);if(old===meta().pinHash)h=old}
    if(h===meta().pinHash){store.set(hostKey(),h);route()}else{S.err='暗証番号がちがいます';renderHostLogin()}

  }
  if(id==='gateform'){
    const name=$('#g-name').value.trim(),pin=$('#g-pin').value.trim(),n=normName(name);
    if(!name){gateErr='お名前をご記入ください';return renderGate()}
    if(!/^\d{4}$/.test(pin)){gateErr='控え番号は4桁の数字でご記入ください';return renderGate()}
    const exist=guests().find(g=>normName(g.name)===n);
    const btn=$('#g-go');btn.disabled=true;
    try{
      if(gateTab==='new'){
        if(exist){gateErr='そのお名前はすでに受付済みです。以前に受付をした方は「再入館の方」からどうぞ';return renderGate()}
        const gid=newId('g'),found={};getLocalFound().forEach(k=>found[k]=true);
        await B.put(S.code,'guests/'+gid,{name,pinHash:await hashOf(`guest|${S.code}|${gid}|${pin}`),found,at:Date.now()});
        store.set(meKey(),gid);
      }else{
        if(!exist||await hashOf(`guest|${S.code}|${exist.id}|${pin}`)!==exist.pinHash){gateErr='お名前か控え番号が違います';return renderGate()}
        store.set(meKey(),exist.id);welcomeBack=true;
        const add={};getLocalFound().forEach(k=>{if(!(exist.found&&exist.found[k]))add[k]=true});
        for(const k of Object.keys(add))await B.put(S.code,`guests/${exist.id}/found/${k}`,true);
      }
      store.del(skipKey());
      const h=location.hash.slice(1);if(h.startsWith('s-')&&!getFound().has(h))justFound=h;
      if(gateTab==='new'){gateTab='ticket';renderGate();return}
      gateOpen=false;modal.innerHTML='';route();
      if(welcomeBack){welcomeBack=false;const t=document.createElement('div');t.className='welcome-toast';t.textContent='おかえりなさいませ';document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
    }catch(err){console.warn(err);gateErr=errText(err);renderGate()}
    return;
  }
  if(id==='cform'){
    const inp=$('#c-text'),text=inp.value.trim(),m=me(),sid=e.target.dataset.spot;
    if(!text||!m)return;

    catch(err){inp.value=text;alertSoft(errText(err))}
  }
});
function alertSoft(t){const p=$('.cmeta');if(p){p.textContent=t;p.style.color='#9b4b36'}}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,id=t.dataset.id;
  if(act==='close-bg'&&e.target!==t)return;
  if(act==='close'||act==='close-bg'){form=null;renderForm();return}
  if(act==='scan'){openScanner();return}
  if(act==='scan-close'){closeScanner();return}
  if(act==='gtab'){gateTab=t.dataset.tab;gateErr='';renderGate();return}
  if(act==='tk-enter'){gateTab='new';gateOpen=false;modal.innerHTML='';route();return}
  if(act==='gskip'){store.set(skipKey(),'1');closeGate();return}
  if(act==='gate-open'){store.del(skipKey());openGate('new');return}
  if(act==='me-menu'){if(t.dataset.confirm){store.del(meKey());localFound=new Set();store.set(foundKey(),'[]');openGate('back')}else{t.dataset.confirm='1';t.textContent='もう一度押すと別の方に切り替え';setTimeout(()=>{if(t.isConnected){delete t.dataset.confirm;route()}},3000)}return}
  if(act==='reset-found'){localFound=new Set();store.set(foundKey(),'[]');const m=me();if(m)await B.del(S.code,`guests/${m.id}/found`).catch(()=>{});route();return}
  if(act==='print'){try{window.print()}catch(err){setStatus('この画面からは印刷できません。ブラウザで直接開いてください。','warn')}return}
  if(act==='copy-url'){try{await navigator.clipboard.writeText(guestUrl());setStatus('URLをコピーしました','ok')}catch(err){setStatus('コピーできませんでした。URLを長押ししてコピーしてください。','warn')}return}
  if(act==='cdel'){
    const m=me(),c=S.party?.comments?.[t.dataset.spot]?.[t.dataset.cid];if(!c)return;
    if(!(isHost()||(m&&c.gid===m.id)))return;
    if(!t.dataset.confirm){t.dataset.confirm='1';t.textContent='本当に削除';return}
    try{await B.del(S.code,`comments/${t.dataset.spot}/${t.dataset.cid}`)}catch(err){}
    return;
  }
  if(!isHost())return;
  if(act==='new'){openForm(null);return}
  if(act==='edit'){openForm((S.party.spots||{})[id]);return}
  if(act==='cat'){syncForm();form.cat=t.dataset.cat;renderForm();return}
  if(act==='rm-photo'){syncForm();form.photo='';renderForm();return}

    const ids=spotsArr().map(s=>s.id),i=ids.indexOf(id),j=act==='up'?i-1:i+1;if(j<0||j>=ids.length)return;
    [ids[i],ids[j]]=[ids[j],ids[i]];S.party.meta.order=ids;renderList();await save(putMeta);return;
  }

    m.welcome=$('#f-welcome').value;m.complete=$('#f-complete').value;m.closed=$('#f-closed').checked;
    await save(putMeta);return;
  }
  if(act==='save-spot'){

    const mm=clone(meta());form=null;renderForm();renderEditor();
    await save(async()=>{await B.put(S.code,'spots/'+s.id,s);await B.put(S.code,'meta',mm)});return;
  }

    const mm=clone(meta());form=null;renderForm();renderEditor();
    await save(async()=>{await B.del(S.code,'spots/'+sid);await B.del(S.code,'comments/'+sid);await B.put(S.code,'meta',mm)});return;
  }

    if(!confirmClear){confirmClear=true;renderEditor();return}

  }

  catch(err){if(h)h.textContent='この写真は読み込めませんでした。別の写真をお試しください。'}
});
document.addEventListener('input',e=>{if(e.target.classList.contains('pin'))e.target.value=e.target.value.replace(/\D/g,'')});

/* ---------- routing ---------- */
function route(){
  if(!B){app.innerHTML='<div class="spin"></div>';return}
  const h=location.hash.slice(1);
  if(!S.code)return h==='new'?renderCreate():renderLanding();
  if(!S.loaded){app.innerHTML='<div class="spin"></div>';return}
  if(S.err&&!S.party){app.innerHTML=`<div class="woodbar"></div><main class="center"><h1>読み込めませんでした</h1><p class="hint">${esc(S.err)}</p></main>`;return}
  if(!S.party){app.innerHTML=`<div class="woodbar"></div><main class="center"><h1>パーティが見つかりません</h1><p class="hint">URLやコードをもう一度確認してください。</p><p><a class="btn ghost" href="${esc(baseUrl())}">トップへ</a></p></main>`;return}
  if(h==='edit')return isHost()?renderEditor():renderHostLogin();
  if(h==='cards')return isHost()?renderCards():renderHostLogin();
  if(h.startsWith('s-'))return renderSpot(h);
  renderHome();
}
window.addEventListener('hashchange',()=>{closeScanner();form=null;if(!gateOpen)modal.innerHTML='';route();window.scrollTo(0,0);app.classList.remove('pg-in');void app.offsetWidth;app.classList.add('pg-in')});

(async function init(){
  B=await makeBackend();
  const p=new URLSearchParams(location.search).get('p');
  if(p)openCode(p.toLowerCase());else route();
})();
})();
</script>
</body>
</html>
