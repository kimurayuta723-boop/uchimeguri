<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f5f2">
<title>うちめぐり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Shippori+Mincho+B1:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2; --white:#ffffff; --gray:#efeeea; --gray2:#e6e4df; --line:#e3e1dc;
  --ink:#2e2b28; --ink2:#55504a; --sub:#8c877f;
  --oak:#b5885d; --oak-d:#93694a; --oak-l:#efe5d8; --walnut:#4a3b30;
  --serif:'Shippori Mincho B1',serif; --sans:'Zen Kaku Gothic New',system-ui,sans-serif; --latin:'Cormorant Garamond',serif;
  --grain:repeating-linear-gradient(91deg,#c09369 0 2px,#b5885d 2px 6px,#c49b72 6px 8px,#ad7f55 8px 13px,#bb8e63 13px 17px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"palt"}
a{color:inherit}
button{font-family:inherit}
.wood{background:var(--grain)}
.woodbar{height:5px;background:var(--grain)}
.eyebrow{margin:0;font-family:var(--latin);font-style:italic;font-size:15px;letter-spacing:.14em;color:var(--oak-d)}
.cap{font-size:10.5px;letter-spacing:.24em;color:var(--sub);font-weight:500}
.hint{color:var(--sub);font-size:12px;line-height:1.8;font-weight:400}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.12em;color:var(--ink2);font-weight:500}
.tag::before{content:"";width:14px;height:1px;background:var(--c)}
.spin{width:24px;height:24px;border:1.5px solid var(--line);border-top-color:var(--oak);border-radius:50%;margin:120px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--walnut);background:var(--walnut);color:#fff;font-size:13px;letter-spacing:.06em;padding:11px 20px;border-radius:2px;text-decoration:none;cursor:pointer;font-weight:500;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.light{background:var(--white);color:var(--ink);border-color:var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.3;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.link.danger{color:#9b4b36}
label.f{display:block;font-size:12.5px;font-weight:500;letter-spacing:.04em;margin-bottom:18px;color:var(--ink2)}
label.f .hint{display:block;margin-top:1px;letter-spacing:0}
input[type=text],input[type=password],input[type=tel],textarea{display:block;width:100%;margin-top:7px;font:inherit;font-size:15px;font-weight:400;color:var(--ink);background:var(--white);border:1px solid var(--line);border-radius:2px;padding:11px 13px;line-height:1.7;letter-spacing:0}
input:focus,textarea:focus{outline:none;border-color:var(--oak);box-shadow:0 0 0 3px rgba(181,136,93,.15)}
textarea{resize:vertical}
.pin{letter-spacing:.5em;text-align:center;font-family:var(--latin);font-size:22px!important}
.check{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:16px;cursor:pointer}
.check input{accent-color:var(--walnut);width:16px;height:16px}

/* ---------- landing ---------- */
.landing{min-height:100vh;display:flex;flex-direction:column}
.landing main{flex:1;max-width:420px;width:100%;margin:0 auto;padding:64px 24px 40px}
.logo{font-family:var(--serif);font-weight:600;font-size:40px;letter-spacing:.08em;margin:14px 0 6px}
.tagline{color:var(--ink2);font-size:14px;letter-spacing:.08em;margin:0 0 44px}
.box{background:var(--white);border:1px solid var(--line);padding:24px 22px;margin-bottom:14px}
.box h2{font-family:var(--serif);font-weight:500;font-size:17px;margin:0 0 6px}
.box p{margin:0 0 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.row input{margin-top:0;flex:1;min-width:0}
.modebadge{font-size:11px;color:var(--sub);text-align:center;margin-top:22px;line-height:1.8}
.err{color:#9b4b36;font-size:12.5px;margin:-6px 0 14px}

/* ---------- guest ---------- */
.guest{max-width:540px;margin:0 auto;padding:40px 22px 110px}
.sample{font-size:11.5px;color:var(--sub);border:1px dashed var(--gray2);padding:8px 12px;margin-bottom:28px;text-align:center;letter-spacing:.04em}
.hero h1{font-family:var(--serif);font-weight:600;font-size:29px;line-height:1.45;margin:10px 0 18px;letter-spacing:.04em}
.hero .lead{line-height:2.05;font-size:14.5px;color:var(--ink2);margin:0 0 14px;white-space:pre-wrap}
.hero .host{font-size:12px;color:var(--sub);margin:0;letter-spacing:.06em}
.progress{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--white);border:1px solid var(--line);padding:18px 20px;margin:34px 0 22px}
.pnum{font-family:var(--latin);display:flex;align-items:baseline;gap:6px;line-height:1}
.pnum b{font-size:52px;font-weight:500}
.pnum span{color:var(--sub);font-size:20px}
.bar{height:4px;background:var(--gray);margin-top:10px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--grain);transition:width .6s ease}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{display:block;text-decoration:none;background:var(--white);border:1px solid var(--line)}
.tile .th{aspect-ratio:1/1;overflow:hidden;background:var(--gray)}
.tile .th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.tile:hover .th img{transform:scale(1.03)}
.tile .tb{padding:11px 12px 13px}
.tile .no{font-family:var(--latin);font-size:15px;color:var(--oak-d)}
.tile .tt{font-size:13px;font-weight:500;line-height:1.55;margin-top:3px}
.tile.hidden{background:transparent;border-style:dashed;border-color:var(--gray2)}
.tile.hidden .th{background:var(--gray);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--c)}
.tile.hidden .th svg{width:28px;height:28px;opacity:.55}
.tile.hidden .th .cap{font-size:9.5px}
.tile.hidden .no{color:var(--sub)}
.tile.hidden .tt{color:var(--sub);font-weight:400;font-size:12px}
.howto{text-align:center;color:var(--sub);font-size:12px;line-height:1.9;margin-top:34px}
.complete{position:relative;background:var(--walnut);color:#f3ece3;padding:24px 22px 24px;margin:0 0 22px;overflow:hidden}
.complete::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--grain)}
.complete .eyebrow{color:#d9bb98}
.complete p{margin:10px 0 0;line-height:2;font-size:14px;white-space:pre-wrap}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--c);background:linear-gradient(160deg,#f3f2ee,#e9e7e2)}
.ph svg{width:30%;max-width:84px;opacity:.6}

.spotpage{max-width:540px;margin:0 auto;padding-bottom:110px}
.spotpage .top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px}
.back{font-size:12.5px;color:var(--ink2);text-decoration:none;letter-spacing:.04em}
.spotpage .count{font-family:var(--latin);font-size:16px;color:var(--sub)}
.photo{position:relative;margin:0;aspect-ratio:4/3.4;overflow:hidden;background:var(--gray)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.stamp{position:absolute;right:18px;bottom:-34px;width:84px;height:84px;border-radius:50%;background:var(--white);color:var(--oak-d);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(46,43,40,.12);transform:rotate(-8deg)}
.stamp::before{content:"";position:absolute;inset:5px;border:1px solid var(--oak);border-radius:50%}
.stamp b{font-family:var(--latin);font-style:italic;font-weight:500;font-size:17px;letter-spacing:.06em;line-height:1}
.stamp small{font-size:9.5px;letter-spacing:.2em;margin-top:4px;color:var(--ink2)}
.stamp.anim{animation:stamp .6s cubic-bezier(.2,1.5,.4,1) .3s both}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.2);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.photo-wrap{position:relative}
.sbody-wrap{padding:30px 22px 0}
.smeta{display:flex;align-items:baseline;gap:16px;margin-bottom:8px}
.smeta .no{font-family:var(--latin);font-size:30px;line-height:1;color:var(--oak-d)}
.stitle{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.5;margin:6px 0 16px;letter-spacing:.03em}
.sbody{font-size:15px;line-height:2.1;margin:0 0 30px;color:var(--ink2)}
.ask{background:var(--white);border:1px solid var(--line);padding:20px 20px 18px;margin-bottom:30px;position:relative}
.ask::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--grain)}
.ask .cap{color:var(--oak-d)}
.ask .q{margin:8px 0 8px;font-family:var(--serif);font-weight:500;font-size:17px;line-height:1.75}
.ask .hint{margin:0}
.plink{display:flex;justify-content:space-between;align-items:center;font-size:13px;text-decoration:none;border-top:1px solid var(--line);padding-top:16px;color:var(--ink2)}
.center{text-align:center;padding-top:110px}
.center h1{font-family:var(--serif);font-weight:500;font-size:23px;margin:14px 0}
.ownerbar{position:fixed;right:16px;bottom:16px;background:var(--walnut);color:#fff;text-decoration:none;font-size:12.5px;letter-spacing:.06em;padding:11px 18px;border-radius:2px;box-shadow:0 6px 20px rgba(46,43,40,.18)}
.resetlink{display:block;margin:14px auto 0;background:none;border:0;color:var(--sub);font-size:11px;text-decoration:underline;cursor:pointer}

/* ---------- host ---------- */
.ed{max-width:880px;margin:0 auto;padding:28px 22px 90px}
.edbar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.edlogo{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:.06em;margin:4px 0 0}
.edlogo small{font-family:var(--sans);font-size:12px;color:var(--sub);font-weight:400;margin-left:10px;letter-spacing:.04em}
.edbar nav{display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:12px;padding:9px 14px;margin-bottom:18px;background:var(--white);border:1px solid var(--line);color:var(--sub);display:flex;gap:8px;align-items:center}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gray2)}
.status.ok::before{background:#7f9a72}
.status.warn{color:#9b4b36}
.status.warn::before{background:#c0704f}
.note{font-size:13px;line-height:1.85;background:var(--oak-l);padding:13px 16px;margin-bottom:18px;color:var(--ink2)}
.panel{background:var(--white);border:1px solid var(--line);padding:24px 24px 24px;margin-bottom:18px}
.panel h2{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:.04em;margin:0 0 16px}
.panel h2 .count{font-family:var(--latin);font-size:16px;color:var(--sub);font-weight:400;margin-left:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.urlbox{display:flex;gap:8px;align-items:stretch;margin-top:7px}
.urlbox code{flex:1;min-width:0;font-size:12.5px;background:var(--gray);padding:10px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.slist{list-style:none;padding:0;margin:6px 0 0;border-top:1px solid var(--line)}
.slist li{display:grid;grid-template-columns:34px 76px 1fr auto;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:12px 2px}
.slist .num{font-family:var(--latin);color:var(--oak-d);font-size:18px}
.slist .sthumb{width:76px;height:57px;overflow:hidden;background:var(--gray)}
.slist .sthumb img{width:100%;height:100%;object-fit:cover;display:block}
.slist .smeta2{min-width:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.slist .smeta2 b{font-weight:500;font-size:14px}
.slist .smeta2 .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slist .sact{display:flex;gap:4px}
.ib{border:1px solid var(--line);background:var(--white);border-radius:2px;min-width:34px;height:34px;cursor:pointer;font-size:12.5px;color:var(--ink);padding:0 11px}
.ib:hover{border-color:var(--oak)}
.ib:disabled{opacity:.3;cursor:default}
.empty{padding:30px;text-align:center;color:var(--sub);font-size:13px;display:block!important}
.steps ol{margin:0;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;gap:4px;font-size:13px;line-height:1.85;padding:6px 0;color:var(--ink2)}
.steps li::before{content:counter(st,decimal-leading-zero);font-family:var(--latin);font-size:17px;color:var(--oak-d);line-height:1.5}
.steps li b{color:var(--ink);font-weight:500}

.overlay{position:fixed;inset:0;background:rgba(46,43,40,.38);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px;z-index:10;backdrop-filter:blur(2px)}
.sheet{background:var(--bg);width:100%;max-width:580px;box-shadow:0 24px 60px rgba(0,0,0,.18)}
.sheet .woodbar{height:4px}
.sheet .inner{padding:22px 24px 22px}
.sheet h2{font-family:var(--serif);font-weight:600;font-size:20px;margin:0;letter-spacing:.04em}
.x{border:0;background:none;font-size:24px;cursor:pointer;color:var(--sub);line-height:1}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 20px}
.catbtn{border:1px solid var(--line);background:var(--white);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--sub);font-size:11.5px;border-radius:2px}
.catbtn svg{width:22px;height:22px}
.catbtn.on{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 -3px 0 var(--c)}
.photo-field{display:flex;gap:16px;align-items:center;margin-bottom:22px}
.photo-field .pv{width:128px;height:96px;overflow:hidden;flex:none;background:var(--gray)}
.photo-field .pv img{width:100%;height:100%;object-fit:cover;display:block}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sheet .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}

.cardgrid{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
@media (max-width:600px){
  .two{grid-template-columns:1fr}
  .slist li{grid-template-columns:60px 1fr;grid-template-areas:"t m" "a a";row-gap:8px}
  .slist .num{display:none}
  .slist .sthumb{width:60px;height:45px;grid-area:t}
  .slist .smeta2{grid-area:m}
  .slist .sact{grid-area:a;justify-content:flex-end}
  .cats{grid-template-columns:repeat(2,1fr)}
  .panel{padding:20px 18px}
}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  .noprint{display:none!important}
  .ed{padding:0;max-width:none}
  .cardgrid{display:grid;grid-template-columns:repeat(3,63mm);gap:2mm;justify-content:center;margin:0}
  .qc{border-style:dashed!important}
}
</style>

	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

      :`<div class="tile hidden" style="--c:${c.color}"><div class="th">${ICON[s.cat]||''}<span class="cap">${c.en}</span></div><div class="tb"><div class="no">No.${pad(i+1)}</div><div class="tt">まだ見つけていません</div></div></div>`}).join('')}</section>
    <p class="howto">家のあちこちにあるカードのQRコードを、<br>スマホのカメラで読み取ってください。<br>順番も時間制限もありません。</p>
    ${isHost()?'<button class="resetlink" data-act="reset-found">（ホスト用）この端末のスタンプをリセット</button>':''}
  </main>`+ownerBar();
}
function renderSpot(id){
  const s=(S.party.spots||{})[id];
  if(!s){app.innerHTML=`<div class="woodbar"></div><main class="guest center"><h1>カードが見つかりません</h1><p class="hint">QRコードをもう一度読み取ってみてください。</p><p><a class="btn ghost" href="#">一覧へ</a></p></main>`;return}
  if(meta().closed&&!isHost())return closedView();
  const isNew=addFound(id),sp=spotsArr(),idx=sp.findIndex(x=>x.id===id),f=getFound(),n=sp.filter(x=>f.has(x.id)).length,c=cat(s);
  app.innerHTML=`<main class="spotpage">
    <div class="top"><a class="back" href="#">← ${esc(meta().title)}</a><span class="count">${n} / ${sp.length}</span></div>
    <div class="photo-wrap"><figure class="photo">${visual(s)}</figure><div class="stamp ${isNew?'anim':''}"><b>found</b><small>見つけた</small></div></div>
    <div class="sbody-wrap">
      <div class="smeta"><span class="no">No.${pad(idx+1)}</span><span class="tag" style="--c:${c.color}">${c.label}</span></div>
      <h1 class="stitle">${esc(s.title)}</h1>
      ${s.body?`<p class="sbody">${br(s.body)}</p>`:''}
      ${s.question?`<aside class="ask"><span class="cap">話のきっかけ</span><p class="q">${esc(s.question)}</p><p class="hint">近くにいる人と、話してみてください。</p></aside>`:''}
      ${n===sp.length&&isNew?completeCard():''}
      <a class="plink" href="#"><span>見つけたカードを見る</span><span>→</span></a>
    </div>
  </main>`+ownerBar();
}

/* ---------- host: editor ---------- */
function setStatus(text,kind){S.status={text,kind};const el=$('#status');if(el){el.textContent=text;el.className='status noprint '+(kind||'')}}
function statusHtml(){const s=S.status.text?S.status:{text:B.mode==='cloud'?'クラウドに保存されます':'この端末だけに保存されるお試しモードです',kind:B.mode==='cloud'?'ok':'warn'};return `<div id="status" class="status noprint ${s.kind}">${esc(s.text)}</div>`}
function edHeader(title,sub,nav){return `<header class="edbar noprint"><div><p class="eyebrow">for the host</p><h1 class="edlogo">${title}<small>${sub}</small></h1></div><nav>${nav}</nav></header>`}
function renderEditor(){
  const m=meta();
  app.innerHTML=`<div class="woodbar noprint"></div><div class="ed">
    ${edHeader('うちめぐり','ホスト用ページ','<a class="btn light" href="#">ゲスト画面を見る</a><a class="btn" href="#cards">QRカードを印刷</a>')}
    ${statusHtml()}
    ${m.sample?`<div class="note">いま入っているのはサンプルです。そのまま書き換えるか、<button class="link" data-act="clear-sample">${confirmClear?'本当に消す（もう一度押す）':'サンプルを全部消す'}</button>こともできます。</div>`:''}
    <section class="panel"><h2>基本情報</h2>
      <div class="two"><label class="f">タイトル<input type="text" id="f-title" value="${esc(m.title)}"></label>
      <label class="f">ホストの名前<input type="text" id="f-host" value="${esc(m.host)}"></label></div>
      <label class="f">ようこそメッセージ<span class="hint">ゲストが最初に読む文章です</span><textarea id="f-welcome" rows="3">${esc(m.welcome)}</textarea></label>
      <label class="f">全部見つけた人へのメッセージ<textarea id="f-complete" rows="2">${esc(m.complete)}</textarea></label>
      <label class="check"><input type="checkbox" id="f-closed" ${m.closed?'checked':''}> パーティ終了（ゲストには「終了しました」だけを表示）</label>
      <div class="row end"><button class="btn" data-act="save-meta">基本情報を保存</button></div>
    </section>
    <section class="panel"><div class="row between" style="margin-bottom:6px"><h2 style="margin:0">スポット<span class="count" id="spcount">${spotsArr().length}</span></h2><button class="btn" data-act="new">＋ 追加</button></div>
      <p class="hint" style="margin:0 0 12px">目安は8〜12か所。寝室など、入ってほしくない部屋には置かないでください。</p>
      <ol class="slist" id="slist"></ol>
    </section>
    <section class="panel"><h2>ゲスト用URL</h2>
      <p class="hint" style="margin:0">QRコードにはこのURLが入ります。パーティコード <b style="font-family:var(--latin);font-size:15px;color:var(--ink)">${esc(S.code)}</b></p>
      <div class="urlbox"><code>${esc(guestUrl())}</code><button class="btn light" data-act="copy-url">コピー</button></div>
    </section>
    <section class="panel steps"><h2>当日までの流れ</h2><ol>
      <li><span><b>スポットを作る</b>　写真・エピソード・話のきっかけを入れる</span></li>
      <li><span><b>QRカードを印刷</b>　切り離して、家のあちこちに置く</span></li>
      <li><span><b>当日</b>　ゲストはQRを読むだけ。アプリのインストールもログインも不要です</span></li>
      <li><span><b>終わったら「パーティ終了」にチェック</b>　家の写真が見られる状態を残さないために</span></li>
    </ol></section>
  </div>`;
  renderList();
}
function renderList(){
  const el=$('#slist');if(!el)return;const sp=spotsArr();
  if(!sp.length){el.innerHTML='<li class="empty">まだスポットがありません。「＋ 追加」から作りましょう。</li>';return}
  el.innerHTML=sp.map((s,i)=>{const c=cat(s);return `<li>
    <span class="num">${pad(i+1)}</span><div class="sthumb">${visual(s)}</div>
    <div class="smeta2"><span class="tag" style="--c:${c.color}">${c.label}</span><b>${esc(s.title)||'（無題）'}</b>${s.question?`<span class="hint">${esc(s.question)}</span>`:''}</div>
    <div class="sact"><button class="ib" data-act="up" data-id="${s.id}" ${i===0?'disabled':''} aria-label="上へ">↑</button><button class="ib" data-act="down" data-id="${s.id}" ${i===sp.length-1?'disabled':''} aria-label="下へ">↓</button><button class="ib" data-act="edit" data-id="${s.id}">編集</button></div></li>`}).join('');
}
function openForm(s){form=s?{...clone(s),isNew:false}:{id:newId(),cat:'interior',title:'',body:'',question:'',photo:'',isNew:true};confirmDel=false;renderForm()}
function renderForm(){
  if(!form){modal.innerHTML='';return}
  const f=form;
  modal.innerHTML=`<div class="overlay" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="woodbar"></div><div class="inner">
    <div class="row between"><h2>${f.isNew?'スポットを追加':'スポットを編集'}</h2><button class="x" data-act="close" aria-label="閉じる">×</button></div>
    <div class="cats">${Object.entries(CATS).map(([k,c])=>`<button type="button" class="catbtn ${f.cat===k?'on':''}" data-act="cat" data-cat="${k}" style="--c:${c.color}">${ICON[k]}<span>${c.label}</span></button>`).join('')}</div>
    <label class="f">タイトル<input type="text" id="s-title" placeholder="例：リビングのランプ" value="${esc(f.title)}"></label>
    <label class="f">エピソード<span class="hint">由来、こだわり、失敗談など。短くてOKです</span><textarea id="s-body" rows="5">${esc(f.body)}</textarea></label>
    <label class="f">話のきっかけ<span class="hint">ゲスト同士で話したくなる、軽い問いかけを1つ</span><input type="text" id="s-q" placeholder="例：一目惚れで買ったもの、ありますか？" value="${esc(f.question)}"></label>
    <div class="photo-field"><div class="pv">${visual(f)}</div>
      <div><label class="btn light file">写真を選ぶ<input type="file" accept="image/*" id="s-photo"></label>
      ${f.photo?'　<button class="link" data-act="rm-photo">写真を外す</button>':''}
      <p class="hint" id="photo-hint" style="margin:6px 0 0">自動で小さくしてから保存します</p></div></div>
    <div class="foot">${f.isNew?'<span></span>':`<button class="link danger" data-act="del">${confirmDel?'本当に削除する（もう一度押す）':'このスポットを削除'}</button>`}
      <div class="row"><button class="btn ghost" data-act="close">キャンセル</button><button class="btn" data-act="save-spot">保存</button></div></div>
  </div></div></div>`;
}
function syncForm(){if(!form)return;const t=$('#s-title'),b=$('#s-body'),q=$('#s-q');if(t)form.title=t.value;if(b)form.body=b.value;if(q)form.question=q.value}
function resizeImage(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const draw=m=>{const sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c};
      let max=1100,q=.8,c=draw(max),out=c.toDataURL('image/jpeg',q);
      while(out.length>170000&&max>400){if(q>.55)q-=.1;else{max-=150;c=draw(max);q=.75}out=c.toDataURL('image/jpeg',q)}
      URL.revokeObjectURL(url);res(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url;
  });
}
async function save(fn){
  setStatus('保存中…','');
  try{await fn();setStatus(B.mode==='cloud'?'保存しました':'この端末に保存しました','ok');return true}
  catch(e){console.warn(e);setStatus(e&&e.code==='quota'?'端末の保存容量がいっぱいです。写真を減らしてください。':/permission/i.test(String(e&&(e.code||e.message)))?'保存できませんでした（Firebaseのルールで書き込みが許可されていません）':'保存できませんでした。通信状況を確認してもう一度お試しください。','warn');return false}
}
const putMeta=()=>B.setMeta(S.code,clone(meta()));

/* ---------- host: cards ---------- */
function qrSvg(text){
  try{const q=new QRLib.QRCode(-1,QRLib.L.M);q.addData(text);q.make();const n=q.getModuleCount();let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c} ${r}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n} ${n}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><path d="${d}" fill="#2e2b28"/></svg>`}
  catch(e){return '<div class="qc-none">QRを作れませんでした</div>'}
}
function cardHtml(s,i){const c=cat(s);return `<div class="qc" style="--c:${c.color}">
  <div class="qc-top"><span class="qc-no">${pad(i+1)}</span><span class="qc-cat">${c.en}</span></div>
  <div class="qc-title">${esc(s.title)}</div>
  <div class="qc-qr">${qrSvg(guestUrl()+'#'+s.id)}</div>
  <div class="qc-foot"><b>${esc(meta().title)}</b>スマホのカメラで読み取ってね</div><div class="qc-wood"></div></div>`}
function renderCards(){
  const sp=spotsArr();
  app.innerHTML=`<div class="woodbar noprint"></div><div class="ed">
    ${edHeader('QRカード',sp.length+'枚','<a class="btn light" href="#edit">← 編集にもどる</a><button class="btn" data-act="print">印刷する</button>')}
    ${statusHtml()}
    <p class="hint noprint" style="margin:0">トランプくらいの大きさ（63×88mm）で、A4に9枚並びます。印刷のときは倍率を「100%」、「背景のグラフィック」をオンにしてください。</p>
    ${B.mode==='local'?'<div class="note noprint" style="margin-top:12px">お試しモードのため、QRコードはこの端末でしか開けません。本番はFirebaseにつないだ状態で印刷してください。</div>':''}
    <div class="cardgrid">${sp.map(cardHtml).join('')}</div>
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener('submit',async e=>{
  e.preventDefault();
  if(e.target.id==='openform'){const c=$('#opencode').value.trim().toLowerCase();if(c){location.hash='';openCode(c)}return}
  if(e.target.id==='createform'){
    const title=$('#c-title').value.trim(),host=$('#c-host').value.trim(),pin=$('#c-pin').value.trim(),sample=$('#c-sample').checked;
    if(!title){S.err='タイトルを入れてください';return renderCreate()}
    if(!/^\d{4,6}$/.test(pin)){S.err='暗証番号は4〜6桁の数字で入れてください';return renderCreate()}
    const btn=$('#c-go');btn.disabled=true;btn.textContent='作成中…';
    try{
      let code=genCode();for(let i=0;i<5&&await B.exists(code);i++)code=genCode();
      const spots={},order=[];
      if(sample)SAMPLE.forEach(s=>{const id=newId();spots[id]={...s,id,photo:''};order.push(id)});
      const h=await pinHash(code,pin);
      await B.create(code,{meta:{title,host,welcome:'今日は来てくれてありがとう。\n家のあちこちに小さなカードを置いています。気が向いたときに、QRを読み取ってみてください。',complete:'全部見つけてくれてありがとう！',closed:false,sample,order,pinHash:h,createdAt:Date.now()},spots});
      store.set('uchimeguri:host:'+code,h);
      location.hash='edit';openCode(code);
    }catch(err){console.warn(err);S.err='作成できませんでした。通信状況やFirebaseのルールを確認してください。';renderCreate()}
    return;
  }
  if(e.target.id==='loginform'){
    const h=await pinHash(S.code,$('#l-pin').value.trim());
    if(h===meta().pinHash){store.set(hostKey(),h);route()}else{S.err='暗証番号がちがいます';renderLogin()}
  }
});
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act,id=t.dataset.id;
  if(act==='close-bg'&&e.target!==t)return;
  if(act==='close'||act==='close-bg'){form=null;renderForm();return}
  if(act==='reset-found'){found=new Set();store.set(foundKey(),'[]');renderHome();return}
  if(act==='print'){try{window.print()}catch(err){setStatus('この画面からは印刷できません。ブラウザで直接開いてください。','warn')}return}
  if(act==='copy-url'){try{await navigator.clipboard.writeText(guestUrl());setStatus('URLをコピーしました','ok')}catch(err){setStatus('コピーできませんでした。URLを長押ししてコピーしてください。','warn')}return}
  if(!isHost())return;
  if(act==='new'){openForm(null);return}
  if(act==='edit'){openForm((S.party.spots||{})[id]);return}
  if(act==='cat'){syncForm();form.cat=t.dataset.cat;renderForm();return}
  if(act==='rm-photo'){syncForm();form.photo='';renderForm();return}
  if(act==='up'||act==='down'){
    const ids=spotsArr().map(s=>s.id),i=ids.indexOf(id),j=act==='up'?i-1:i+1;if(j<0||j>=ids.length)return;
    [ids[i],ids[j]]=[ids[j],ids[i]];S.party.meta.order=ids;renderList();await save(putMeta);return;
  }
  if(act==='save-meta'){
    const m=S.party.meta;m.title=$('#f-title').value.trim()||'ようこそ';m.host=$('#f-host').value.trim();
    m.welcome=$('#f-welcome').value;m.complete=$('#f-complete').value;m.closed=$('#f-closed').checked;
    await save(putMeta);return;
  }
  if(act==='save-spot'){
    syncForm();const f=form,s={id:f.id,cat:f.cat,title:f.title.trim(),body:f.body.trim(),question:f.question.trim(),photo:f.photo||''};
    if(!s.title){$('#s-title').focus();return}
    S.party.spots=S.party.spots||{};S.party.spots[s.id]=s;
    S.party.meta.order=spotsArr().map(x=>x.id);S.party.meta.sample=false;
    form=null;renderForm();renderEditor();
    await save(async()=>{await B.setSpot(S.code,s);await putMeta()});return;
  }
  if(act==='del'){
    if(!confirmDel){confirmDel=true;syncForm();renderForm();return}
    const sid=form.id;delete S.party.spots[sid];S.party.meta.order=(S.party.meta.order||[]).filter(x=>x!==sid);S.party.meta.sample=false;
    form=null;renderForm();renderEditor();
    await save(async()=>{await B.delSpot(S.code,sid);await putMeta()});return;
  }
  if(act==='clear-sample'){
    if(!confirmClear){confirmClear=true;renderEditor();return}
    confirmClear=false;const old=Object.keys(S.party.spots||{});
    S.party.spots={};S.party.meta.order=[];S.party.meta.sample=false;renderEditor();
    await save(async()=>{for(const x of old)await B.delSpot(S.code,x);await putMeta()});return;
  }
});
document.addEventListener('change',async e=>{
  if(e.target.id!=='s-photo'||!e.target.files||!e.target.files[0])return;
  syncForm();const h=$('#photo-hint');if(h)h.textContent='写真を準備中…';
  try{form.photo=await resizeImage(e.target.files[0]);renderForm()}
  catch(err){if(h)h.textContent='この写真は読み込めませんでした。別の写真をお試しください。'}
});
document.addEventListener('input',e=>{if(e.target.classList.contains('pin'))e.target.value=e.target.value.replace(/\D/g,'')});

/* ---------- routing ---------- */
function route(){
  const h=location.hash.slice(1);
  if(!S.code)return h==='new'?renderCreate():renderLanding();
  if(!S.loaded){app.innerHTML='<div class="spin"></div>';return}
  if(S.err&&!S.party){app.innerHTML=`<div class="woodbar"></div><main class="guest center"><h1>読み込めませんでした</h1><p class="hint">${esc(S.err)}</p></main>`;return}
  if(!S.party){app.innerHTML=`<div class="woodbar"></div><main class="guest center"><h1>パーティが見つかりません</h1><p class="hint">URLやコードをもう一度確認してください。</p><p><button class="btn ghost" data-act="go-top" onclick="location.href=location.href.split(/[?#]/)[0]">トップへ</button></p></main>`;return}
  if(h==='edit')return isHost()?renderEditor():renderLogin();
  if(h==='cards')return isHost()?renderCards():renderLogin();
  if(h.startsWith('s-'))return renderSpot(h);
  renderHome();
}
window.addEventListener('hashchange',()=>{form=null;renderForm();route();window.scrollTo(0,0)});

(async function init(){
  B=await makeBackend();
  const p=new URLSearchParams(location.search).get('p');
  if(p)openCode(p.toLowerCase());else route();
})();
})();
</script>
